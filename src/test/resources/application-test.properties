spring.application.name=semumreal
#config banco de dados - PERFIL TEST (H2 em memória)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Desabilita o Liquibase nos testes (opcional, se quiser usar Hibernate para criar as tabelas)
spring.liquibase.enabled=false
app.jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
app.jwt.expiration=3600000
