# Copy this file to application-local.properties (gitignored) and fill in your values.
#
#   cp src/main/resources/application-local.example.properties src/main/resources/application-local.properties
#
# Generate a JWT secret (Base64, min. 256 bits):
#   openssl rand -base64 32

spring.application.name=semumreal

# Database — local profile
spring.datasource.url=jdbc:postgresql://localhost:5432/semumreal_local
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.context-path=/semumreal

app.jwt.secret=replace-with-base64-secret
app.jwt.expiration=86400000

# Google Sign-In — comma-separated OAuth 2.0 client IDs (Web, Android, iOS)
# Create them in Google Cloud Console > APIs & Services > Credentials
app.google.client-ids=your-web-client-id.apps.googleusercontent.com

# Browser origins allowed to call the API (Expo web, Angular local)
app.cors.allowed-origins=http://localhost:8081,http://127.0.0.1:8081,http://localhost:8181,http://127.0.0.1:8181,http://localhost:4200,http://127.0.0.1:4200
